[project]
name = "t2c"
version = "0.1.0"
description = "Fine-tuning small LLMs for text -> CadQuery generation: data, benchmarks, SFT and GRPO with a geometric verifier."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # CAD kernel + geometry metrics (CPU only; enough for data prep and scoring)
    "cadquery>=2.8,<3",
    "numpy>=2.2",
    "scipy>=1.15",
    "trimesh>=4.5",
    # data + bookkeeping
    "datasets>=5.0",
    "huggingface_hub>=1.0",
    "pyarrow>=20",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "jinja2>=3.1",
    # API backend (frontier baselines, or any OpenAI-compatible server)
    "openai>=2.0",
]

[project.optional-dependencies]
# Everything needed on a GPU node: local inference (vLLM) + training (TRL).
gpu = [
    "torch>=2.9",
    "transformers>=5.0",
    "trl>=1.10",
    "accelerate>=1.10",
    "vllm>=0.30",
    "tensorboard>=2.18",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
t2c = "t2c.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.uv]
# Use uv's own standalone CPython so both clusters run the identical interpreter
# (no dependency on whatever conda/system python happens to be installed).
python-preference = "only-managed"
