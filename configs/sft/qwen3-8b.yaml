# Stage 1 -- SFT, Qwen3-8B, full fine-tuning (fp32 weights + AdamW need ~100 GB: one H200, or 2+ GPUs via accelerate).
#   scripts/submit.sh --gpus 1 --time 1-00:00:00 --name sft-q3-8b -- t2c train sft configs/sft/qwen3-8b.yaml
run_name: sft-qwen3-8b-v1
base_model: Qwen/Qwen3-8B
chat_template_kwargs:
  enable_thinking: false        # answer directly; the same kwargs are stored with the checkpoint and reused at inference

data:
  dataset: sft/v1               # built by `t2c data build configs/data/sft_v1.yaml`
  max_length: 2048              # tokens (prompt + script); longer samples are dropped, not truncated

weights_dtype: float32          # full fine-tuning: keep fp32 master weights, autocast to bf16
report_to: [tensorboard]        # add "wandb" or "trackio" if you use them
seed: 0

eval_during_training:           # benchmark scores vs. step, logged next to the loss (src/t2c/train/callbacks.py)
  every_steps: 1000             # 0 turns it off
  benchmarks: [cqe, deepcad]    # add cadprompt, synth or t2cb for more curves (about a minute each per evaluation)
  limit: 48                     # samples per benchmark: a fixed, evenly spread subset
  max_new_tokens: 768
  batch_size: 32
  at_start: true                # also score the untouched model at step 0

train:                          # passed to trl.SFTConfig / transformers.TrainingArguments
  num_train_epochs: 2
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_steps: 0.03             # a float < 1 is a fraction of total steps
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  train_sampling_strategy: group_by_length   # batches of similar length: less padding
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 500
  per_device_eval_batch_size: 64
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 2            # each checkpoint is ~100 GB with optimizer state (fp32 weights + AdamW)
  dataloader_num_workers: 4
  gradient_checkpointing: true
