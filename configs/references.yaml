  caveat: >-
    Published on the full 600-part benchmark with the authors' prompt (5 in-context examples)
    and up to 3 error-feedback retries. We can only run the public 151-part prompt sample,
    and only IR until ground truth is obtained from the authors. Scores date from early 2026.
