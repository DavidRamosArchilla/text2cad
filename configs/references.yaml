cadprompt:
  source: "CADPrompt / CADCodeVerify, arXiv 2410.05340 (ICLR 2025), Table 2, single-shot 'Generated' rows"
  caveat: >-
    Only the compile rate is comparable (reported here as IR = 1 - compile rate). The paper's
    geometric metrics use ICP alignment, 1000 points and medians, so they are not listed.
    2024-era models.
  rows:
    - {name: "GPT-4 (zero-shot)",     group: overall, ir: 0.080}
    - {name: "GPT-4 (few-shot)",      group: overall, ir: 0.040}
    - {name: "Gemini (zero-shot)",    group: overall, ir: 0.150}
    - {name: "CodeLlama (zero-shot)", group: overall, ir: 0.355}

cqe:
  source: "CadQueryEval leaderboard (drwahl/cadqueryeval), recomputed from the per-attempt table shipped with the dataset"
  caveat: >-
    Same tasks and prompt as our 'protocol' runs; our scorer re-implements the official checks
    without open3d and agrees with the published verdicts on a validation sample
    (`t2c bench validate-cqe`). Rows are loaded automatically from the dataset.
  rows: []
